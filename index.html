<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Chat Render</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; }
    #chat { border: 1px solid #ccc; padding: 10px; height: 300px; overflow-y: auto; margin-bottom: 10px; }
    #chat div { margin: 5px 0; }
    input { padding: 5px; width: 70%; }
    button { padding: 5px 10px; }
  </style>
</head>
<body>

<h3>Простой чат</h3>
<div id="chat"></div>
<input id="msg" placeholder="Напиши сообщение...">
<button onclick="send()">Отправить</button>

<script>
  // Замените REPLACE_URL на вашу ссылку Render, например:
  // const ws = new WebSocket("wss://chat-xxxx.onrender.com");
  const ws = new WebSocket("wss://chat-render-3.onrender.com");

  ws.onopen = () => {
    console.log("Соединение открыто");
  };
https://chat-render-3.onrender.com
  ws.onmessage = (e) => {
    const div = document.createElement("div");
    div.textContent = e.data;
    document.getElementById("chat").appendChild(div);
    // Автопрокрутка вниз
    document.getElementById("chat").scrollTop = document.getElementById("chat").scrollHeight;
  };

  ws.onclose = () => {
    console.log("Соединение закрыто");
  };

  function send(){
    const input = document.getElementById("msg");
    if(input.value.trim() !== ""){
      ws.send(input.value);
      input.value = "";
    }
  }

  // Отправка сообщений по Enter
  document.getElementById("msg").addEventListener("keypress", (e) => {
    if(e.key === "Enter") send();
  });
</script>

</body>
</html>
